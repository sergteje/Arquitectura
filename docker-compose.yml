version: '3.8'

services:
  # API Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arquitectura-api
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=Arquitectura;User=sa;Password=${DB_PASSWORD:-YourStrong!Passw0rd};TrustServerCertificate=True
      - Redis__Connection=${REDIS_CONNECTION:-redis:6379}
      - Jwt__Key=${JWT_KEY:-your-super-secret-key-min-32-chars-long!}
      - Jwt__Issuer=${JWT_ISSUER:-Arquitectura}
      - Jwt__Audience=${JWT_AUDIENCE:-ArquitecturaClients}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_TRACES_ENDPOINT:-http://jaeger:4317}
      # Logs go to Seq's OTLP ingest, never to the trace collector: Jaeger drops them.
      - Seq__Url=${SEQ_URL:-http://seq:5341}
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_started
      seq:
        condition: service_started
    networks:
      - arquitectura-network
      - observability

  # Frontend React/Vite
  frontend:
    image: node:20-alpine
    container_name: arquitectura-frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://api:8080
    volumes:
      - ./Arquitectura.Client:/app
    depends_on:
      - api
    networks:
      - arquitectura-network

  # SQL Server
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: arquitectura-sqlserver
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD:-YourStrong!Passw0rd}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourStrong!Passw0rd -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - arquitectura-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: arquitectura-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - arquitectura-network

  # Observability - Jaeger
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: arquitectura-jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=memory
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    networks:
      - observability

  # Observability - Seq (Logs)
  seq:
    image: datalust/seq:2024.3
    container_name: arquitectura-seq
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FREEMODE_ENABLED=true
      # Without this the image refuses to start: no admin password is supplied.
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    ports:
      - "5341:5341"
      - "5342:80"
    volumes:
      - seq-data:/data
    networks:
      - observability

  # Observability - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: arquitectura-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - jaeger
    networks:
      - observability

  # Observability - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: arquitectura-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - observability

volumes:
  sqlserver-data:
  redis-data:
  seq-data:
  grafana-data:
  prometheus-data:

networks:
  arquitectura-network:
    name: arquitectura-network
  observability:
    name: observability-network